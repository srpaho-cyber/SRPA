<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LR Print</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:210mm;
  background:#e5e7eb;
  font-family:'IBM Plex Sans',sans-serif;
  font-size:7.5pt;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

@page{
  size:A4 portrait;
  margin:5mm;
}

/* 200mm × 287mm printable area (A4 minus 5mm margins) */
.page{
  width:200mm;
  height:287mm;
  background:#fff;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* each copy = 287/3 = 95.67mm */
.copy{
  width:100%;
  height:95.67mm;
  max-height:95.67mm;
  min-height:95.67mm;
  overflow:hidden;
  padding:3mm 3.5mm 2mm;
  border-bottom:1.2pt dashed #94a3b8;
  display:flex;
  flex-direction:column;
  gap:1.2mm;
  position:relative;
}
.copy:last-child{border-bottom:none}

/* badge */
.badge{
  position:absolute;top:3mm;right:3.5mm;
  font-family:'IBM Plex Mono',monospace;
  font-size:5.5pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#fff;padding:1px 6px;border-radius:1px;
}
.off{background:#1e3a5f}
.sor{background:#14532d}
.see{background:#7c2d12}

/* HEADER */
.hd{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:1.8mm;border-bottom:1.5pt solid #0f172a;flex-shrink:0;
}
.co-name{font-family:'Barlow Condensed',sans-serif;font-size:13pt;font-weight:800;color:#0f172a;letter-spacing:.3px;line-height:1}
.co-sub{font-family:'IBM Plex Mono',monospace;font-size:5.5pt;color:#475569;margin-top:1.5px;line-height:1.5;max-width:120mm}
.lr-block{text-align:right;flex-shrink:0;padding-left:6mm}
.lr-tag{font-family:'IBM Plex Mono',monospace;font-size:5pt;letter-spacing:1.5px;text-transform:uppercase;color:#64748b}
.lr-num{font-family:'Barlow Condensed',monospace;font-size:15pt;font-weight:800;color:#0f172a;letter-spacing:.3px;line-height:1}
.lr-dt{font-family:'IBM Plex Mono',monospace;font-size:5.5pt;color:#475569;margin-top:1px}

/* PARTIES + TRIP: [consignor 37%][consignee 37%][trip 26%] */
.info-row{
  display:grid;grid-template-columns:37fr 37fr 26fr;
  border:.4pt solid #cbd5e1;border-radius:1px;flex-shrink:0;
}
.party-box{padding:1.8mm 2.5mm;border-right:.4pt solid #cbd5e1}
.party-box:last-of-type{border-right:none}
.p-head{font-family:'IBM Plex Mono',monospace;font-size:5pt;letter-spacing:.8px;text-transform:uppercase;color:#64748b;line-height:1;margin-bottom:1.5px;padding-bottom:1px;border-bottom:.3pt solid #e2e8f0}
.p-name{font-size:7pt;font-weight:700;color:#0f172a;line-height:1.25;margin-top:1.5px}
.p-addr{font-size:5.5pt;color:#374151;line-height:1.45;margin-top:1px}
.p-gstin{font-family:'IBM Plex Mono',monospace;font-size:5pt;color:#64748b;margin-top:1px}
.p-none{font-size:5.5pt;color:#9ca3af;font-style:italic;margin-top:1px}

/* trip 2×4 grid */
.trip{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr)}
.tf{padding:1.5px 3px;border-bottom:.4pt solid #e2e8f0;border-right:.4pt solid #e2e8f0;display:flex;flex-direction:column;gap:.5px}
.tf:nth-child(even){border-right:none}
.tf:nth-last-child(-n+2){border-bottom:none}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:5pt;letter-spacing:.5px;text-transform:uppercase;color:#64748b;line-height:1}
.val{font-size:6.5pt;font-weight:600;color:#0f172a;line-height:1.3}
.val.mono{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:6pt}
.val.xs{font-size:6pt}

/* payment pill */
.pay{display:inline-block;padding:0 4px;border-radius:1px;font-family:'IBM Plex Mono',monospace;font-size:5pt;font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:13px}
.topay {background:#cffafe;color:#0e7490;border:.3pt solid #a5f3fc}
.paid  {background:#dcfce7;color:#166534;border:.3pt solid #bbf7d0}
.credit{background:#f3e8ff;color:#6b21a8;border:.3pt solid #e9d5ff}
.billed{background:#fefce8;color:#854d0e;border:.3pt solid #fef08a}

/* GOODS TABLE */
.gtbl{width:100%;border-collapse:collapse;font-size:6pt;border:.4pt solid #cbd5e1;flex-shrink:0}
.gtbl th{background:#f1f5f9;border:.4pt solid #cbd5e1;padding:1px 3.5px;font-family:'IBM Plex Mono',monospace;font-size:5pt;letter-spacing:.5px;text-transform:uppercase;color:#475569;font-weight:500;white-space:nowrap}
.gtbl th.r{text-align:right}
.gtbl td{border:.4pt solid #e2e8f0;padding:1.5px 3.5px;color:#111827;vertical-align:top;line-height:1.3}
.gtbl td.r{text-align:right;font-family:'IBM Plex Mono',monospace}
.gtbl td.c{text-align:center;font-family:'IBM Plex Mono',monospace}
.gtbl .empty td{color:#9ca3af;font-style:italic;font-size:5.5pt;text-align:center;padding:2px}

/* BOTTOM */
.bottom{display:flex;gap:2.5mm;margin-top:auto;align-items:flex-end;flex-shrink:0}
.terms-blk{flex:1;font-size:5pt;color:#64748b;line-height:1.5;font-style:italic}
.terms-blk b{font-style:normal;font-weight:600;color:#374151}

.amt-box{width:54mm;flex-shrink:0;border:.4pt solid #cbd5e1;border-radius:1px;overflow:hidden}
.ar{display:flex;justify-content:space-between;padding:1.2px 4.5px;border-bottom:.4pt solid #e2e8f0}
.ar:last-of-type{border-bottom:none}
.al{font-size:6pt;color:#475569}
.av{font-family:'IBM Plex Mono',monospace;font-size:6pt;font-weight:500;color:#111827}
.tot-row{background:#0f172a;padding:2.5px 4.5px;display:flex;justify-content:space-between}
.tot-lbl{font-family:'Barlow Condensed',sans-serif;font-size:8.5pt;font-weight:700;text-transform:uppercase;color:#fff;letter-spacing:.5px}
.tot-val{font-family:'Barlow Condensed',sans-serif;font-size:9.5pt;font-weight:800;color:#fbbf24}

/* SIGNATURES */
.sigs{display:flex;gap:3mm;border-top:.4pt solid #e2e8f0;padding-top:1.5mm;flex-shrink:0}
.sig{flex:1;text-align:center}
.sig-line{display:block;border-bottom:.6pt solid #94a3b8;height:6mm;width:100%}
.sig-lbl{display:block;font-family:'IBM Plex Mono',monospace;font-size:4.5pt;letter-spacing:.5px;text-transform:uppercase;color:#94a3b8;margin-top:1px}

/* screen controls */
.controls{position:fixed;bottom:16px;right:16px;display:flex;gap:10px;z-index:999}
.btn{padding:9px 18px;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.btn-p{background:#2563eb;color:#fff}
.btn-c{background:#d1d5db;color:#374151}

@media print{
  html,body{width:210mm;height:297mm;background:#fff !important;margin:0;padding:0}
  .controls{display:none !important}
  .page{width:200mm;height:287mm;margin:0;overflow:hidden}
  .copy{-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-inside:avoid}
  .off{background:#1e3a5f !important;color:#fff !important}
  .sor{background:#14532d !important;color:#fff !important}
  .see{background:#7c2d12 !important;color:#fff !important}
  .tot-row{background:#0f172a !important}
  .tot-lbl{color:#fff !important}
  .tot-val{color:#fbbf24 !important}
  .gtbl th{background:#f1f5f9 !important}
  .topay {background:#cffafe !important;color:#0e7490 !important}
  .paid  {background:#dcfce7 !important;color:#166534 !important}
  .credit{background:#f3e8ff !important;color:#6b21a8 !important}
  .billed{background:#fefce8 !important;color:#854d0e !important}
}
</style>
</head>
<body>

<div class="controls">
  <button class="btn btn-c" onclick="window.close()">✕ Close</button>
  <button class="btn btn-p" onclick="window.print()">🖨 Print 3 Copies</button>
</div>

<div class="page" id="page">
  <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;font-family:'IBM Plex Mono',monospace;font-size:9pt">
    Loading LR data…
  </div>
</div>

<script>
/* ── helpers ── */
function fmtINR(n){
  const v=parseFloat(n)||0;
  if(v===0)return '—';
  return '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:2});
}
function fmtDate(s){
  if(!s)return '—';
  try{const d=new Date(s.length===10?s+'T00:00:00':s);
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
  catch(e){return s}
}
function payLabel(t){return{to_pay:'To Pay',paid:'Paid',credit:'Credit',to_be_billed:'To Be Billed'}[t]||t||'—'}
function payClass(t){return{to_pay:'topay',paid:'paid',credit:'credit',to_be_billed:'billed'}[t]||'topay'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ── build one copy block ── */
function buildCopy(lr,co,goods,badgeCls,badgeLabel){
  const coName=esc(co.company_name||'Your Company');
  const coSub=[co.address,co.gstin?'GSTIN: '+co.gstin:'',co.phone].filter(Boolean).map(esc).join(' · ');
  const coCity=esc((co.address||'').split(',').slice(-1)[0]?.trim()||'Mumbai');

  const lrNum=esc(lr.lr_number||'—');
  const lrDt=fmtDate(lr.lr_date).toUpperCase();

  const srName=esc(lr.consignor?.name||'—');
  const srAddr=esc(lr.consignor?.address||'');
  const srGst =esc(lr.consignor?.gstin||'');

  const eeName=esc(lr.consignee?.name||'—');
  const eeAddr=esc(lr.consignee?.address||'');
  const eeGst =esc(lr.consignee?.gstin||'');

  const from   =esc(lr.from_city||'—');
  const to     =esc(lr.to_city||'—');
  const vehicle=esc(lr.vehicle_no||'—');
  const driver =esc(lr.driver?.name||'—');
  const eway   =esc(lr.eway_bill_no||'—');
  const ewayExp=lr.eway_expiry_date?fmtDate(lr.eway_expiry_date):'—';
  const payLbl =esc(payLabel(lr.payment_type));
  const payCls =payClass(lr.payment_type);
  const bookRef=esc(lr.booking_no||lr.booking?.booking_no||'—');

  const freight=fmtINR(lr.freight_amount);
  const hamali =fmtINR(lr.hamali);
  const other  =fmtINR((+lr.unloading||0)+(+lr.st_charge||0)+(+lr.lr_charge||0)+(+lr.other_charges||0));
  const gstLine=lr.gst_enabled?`${lr.gst_pct||18}% — ${fmtINR(lr.gst_amount)}`:'—';
  const roff   =parseFloat(lr.round_off)||0;
  const total  =fmtINR(lr.total_amount);
  const showAmt= lr.show_amount_on_print !== false;  // default true

  const goodsRows=goods.length
    ?goods.map(g=>`<tr>
        <td>${esc(g.desc||'—')}</td>
        <td class="c">${esc(g.pkgs||1)}</td>
        <td class="r">${esc(g.weight||0)}</td>
        <td class="r">${parseFloat(g.rate)>0?'₹'+esc(g.rate):'—'}</td>
        <td class="r">${fmtINR(g.amount)}</td>
      </tr>`).join('')
    :`<tr class="empty"><td colspan="5">No goods description provided</td></tr>`;

  return `
<div class="copy">
  <span class="badge ${badgeCls}">${badgeLabel}</span>

  <div class="hd">
    <div>
      <div class="co-name">${coName}</div>
      <div class="co-sub">${coSub}</div>
    </div>
    <div class="lr-block">
      <div class="lr-tag">Lorry Receipt</div>
      <div class="lr-num">${lrNum}</div>
      <div class="lr-dt">${lrDt}</div>
    </div>
  </div>

  <div class="info-row">
    <div class="party-box">
      <div class="p-head">Consignor (Sender)</div>
      <div class="p-name">${srName}</div>
      ${srAddr?`<div class="p-addr">${srAddr}</div>`:`<div class="p-none">Address not on record</div>`}
      ${srGst?`<div class="p-gstin">GSTIN: ${srGst}</div>`:''}
    </div>
    <div class="party-box">
      <div class="p-head">Consignee (Receiver)</div>
      <div class="p-name">${eeName}</div>
      ${eeAddr?`<div class="p-addr">${eeAddr}</div>`:`<div class="p-none">Address not on record</div>`}
      ${eeGst?`<div class="p-gstin">GSTIN: ${eeGst}</div>`:''}
    </div>
    <div class="trip">
      <div class="tf"><span class="lbl">From</span><span class="val">${from}</span></div>
      <div class="tf"><span class="lbl">To</span><span class="val">${to}</span></div>
      <div class="tf"><span class="lbl">Vehicle</span><span class="val mono">${vehicle}</span></div>
      <div class="tf"><span class="lbl">Driver</span><span class="val xs">${driver}</span></div>
      <div class="tf"><span class="lbl">E-Way Bill</span><span class="val mono">${eway}</span></div>
      <div class="tf"><span class="lbl">EWB Expiry</span><span class="val xs">${ewayExp}</span></div>
      <div class="tf"><span class="lbl">Payment</span><span class="val"><span class="pay ${payCls}">${payLbl}</span></span></div>
      <div class="tf"><span class="lbl">Booking Ref</span><span class="val mono">${bookRef}</span></div>
    </div>
  </div>

  <table class="gtbl">
    <thead><tr>
      <th style="width:40%">Description of Goods</th>
      <th class="r" style="width:10%">Pkgs</th>
      <th class="r" style="width:14%">Wt.(kg)</th>
      <th class="r" style="width:14%">Rate/kg</th>
      <th class="r" style="width:22%">Amount(₹)</th>
    </tr></thead>
    <tbody>${goodsRows}</tbody>
  </table>

  <div class="bottom">
    <div class="terms-blk">
      <div><b>Terms:</b> Goods accepted subject to standard terms. Claims within 7 days. Consignment at owner's risk unless declared. Octroi &amp; local taxes extra.</div>
      <div style="margin-top:1mm">Subject to <b>${coCity}</b> jurisdiction. Computer-generated document.</div>
    </div>
    ${showAmt ? `<div class="amt-box">
      <div class="ar"><span class="al">Freight</span><span class="av">${freight}</span></div>
      <div class="ar"><span class="al">Hamali</span><span class="av">${hamali}</span></div>
      <div class="ar"><span class="al">Other Charges</span><span class="av">${other}</span></div>
      <div class="ar"><span class="al">GST</span><span class="av">${gstLine}</span></div>
      ${Math.abs(roff)>0?`<div class="ar"><span class="al">Round Off</span><span class="av">${fmtINR(roff)}</span></div>`:''}
      <div class="tot-row"><span class="tot-lbl">Total</span><span class="tot-val">${total}</span></div>
    </div>` : ''}
  </div>

  <div class="sigs">
    <div class="sig"><span class="sig-line"></span><span class="sig-lbl">Consignor / Agent</span></div>
    <div class="sig"><span class="sig-line"></span><span class="sig-lbl">Receiver's Signature &amp; Stamp</span></div>
    <div class="sig"><span class="sig-line"></span><span class="sig-lbl">For ${coName} — Auth. Signatory</span></div>
  </div>
</div>`;
}

/* ── render all 3 copies ── */
function renderLR(lr,settings){
  const co=settings||{};
  let goods=[];
  if(Array.isArray(lr.goods_items)&&lr.goods_items.length){
    goods=lr.goods_items;
  }else if(lr.goods_desc){
    goods=[{desc:lr.goods_desc,pkgs:lr.packages||1,weight:lr.weight_kg||0,rate:lr.rate||0,amount:lr.freight_amount||0}];
  }

  const COPIES=[
    {cls:'off',label:'Office Copy'},
    {cls:'sor',label:'Consignor Copy'},
    {cls:'see',label:'Consignee Copy'},
  ];

  document.getElementById('page').innerHTML=
    COPIES.map(b=>buildCopy(lr,co,goods,b.cls,b.label)).join('');
  document.title='LR — '+(lr.lr_number||'Print');
}

/* ════════════════════════════════════════════
   DATA LOADING — two strategies, both tried:

   1. URL param ?d=<base64-json>  ← primary (set by openPrintModal in modules.js)
   2. window.LR_DATA global       ← fallback (set before window.open if same-origin)
   3. postMessage                 ← legacy fallback
   4. ?demo=1                     ← preview/test mode
════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded',function(){
  const params=new URLSearchParams(window.location.search);

  /* Strategy 1: URL param */
  const encoded=params.get('d');
  if(encoded){
    try{
      const payload=JSON.parse(decodeURIComponent(encoded));
      renderLR(payload.lr,payload.settings);
      return;
    }catch(e){console.error('LR decode error',e)}
  }

  /* Strategy 2: global set by opener */
  if(window.LR_DATA){
    renderLR(window.LR_DATA.lr,window.LR_DATA.settings);
    return;
  }

  /* Strategy 3: demo mode */
  if(params.get('demo')==='1'){
    renderLR({
      lr_number:'LR/2026/000042',lr_date:'2026-04-12',
      consignor:{name:'Patel Traders Pvt Ltd',address:'Shop 14, MIDC Andheri East, Mumbai 400069',gstin:'27ABCDE1234F1Z5'},
      consignee:{name:'Singh Enterprises',address:'Plot 9, Phase 2, Manesar Industrial Area, Gurugram 122050',gstin:'06FGHIJ5678K1Z3'},
      from_city:'Mumbai',to_city:'Delhi',
      vehicle_no:'MH04AB1234',driver:{name:'Ramesh Yadav'},
      eway_bill_no:'EWB111222333444',eway_expiry_date:'2026-04-15',
      payment_type:'to_pay',booking_no:'BK/2026/001234',
      freight_amount:12000,hamali:360,unloading:0,st_charge:0,lr_charge:0,other_charges:0,
      gst_enabled:true,gst_pct:18,gst_amount:2160,round_off:0,total_amount:14520,
      goods_desc:'Electronic Components — Fragile Handle with Care',
      packages:10,weight_kg:500,rate:24
    },{
      company_name:'Shree Transport Company',
      address:'Godown 3, Kurla West, Mumbai 400070',
      gstin:'27ZZZZZ9999Z1Z5',phone:'022-12345678'
    });
    if(params.get('autoprint')==='1')setTimeout(()=>window.print(),900);
    return;
  }

  /* Strategy 4: postMessage (legacy) — wait 5 seconds */
  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='lr_data') renderLR(e.data.lr,e.data.settings);
  });
});
</script>
</body>
</html>
